services:
  vulnmart:
    build: .
    container_name: vulnmart
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      ADMIN_BOT_URL: http://vulnmart-admin-bot:9000
      BOT_TRIGGER_SECRET: vulnmart-bot-local-secret

    volumes:
      - ./:/app

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    networks:
      - ctfd_default

networks:
  ctfd_default:
    external: true
