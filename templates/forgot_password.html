{% extends "base.html" %} {% block title %}VulnMart - Forgot Password{% endblock
%} {% block content %}

<section class="auth-container">
  <div class="auth-card">
    <h1>Forgot Password</h1>

    <p class="auth-subtitle">Enter your email to request a password reset.</p>

    <form id="forgot-form">
      <label for="email">Email</label>

      <input type="email" id="email" placeholder="you@example.com" required />

      <button type="submit">Request Reset</button>

      <p id="forgot-message"></p>
    </form>

    <p class="forgot">
      <a href="/login">Back to Login</a>
    </p>
  </div>
</section>

<script>
  const form = document.getElementById("forgot-form");
  const message = document.getElementById("forgot-message");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    message.textContent = "Processing...";

    try {
      const response = await fetch("/api/v3/auth/forgot-password", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          email: email,
        }),
      });

      const data = await response.json();

      if (!response.ok) {
        message.textContent =
          data.detail || "Unable to process password reset request.";
        return;
      }

      message.textContent =
        data.message ||
        "If the account exists, reset instructions have been sent.";

      setTimeout(() => {
        window.location.href = "/reset-password";
      }, 1000);
    } catch (error) {
      console.error(error);
      message.textContent = "Unable to connect to server.";
    }
  });
</script>

{% endblock %}
