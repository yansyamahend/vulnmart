<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CrewPanel - Login</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/style.css') }}"
    />
  </head>

  <body>
    <main class="container">
      <section class="auth-container">
        <div class="auth-card">
          <h1>CrewPanel</h1>

          <p class="auth-subtitle">Crew authentication portal</p>

          <form id="login-form">
            <label for="username"> Username </label>

            <input type="text" id="username" required />

            <label for="password"> Password </label>

            <input type="password" id="password" required />

            <button type="submit">Login</button>

            <p id="message"></p>
          </form>

          <p class="forgot">
            Don't have an account?
            <a href="/CrewPanel/register"> Register </a>
          </p>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById("login-form");
      const message = document.getElementById("message");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const username = document.getElementById("username").value;

        const password = document.getElementById("password").value;

        const response = await fetch("/api/crew/login", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify({
            username: username,
            password: password,
          }),
        });

        const data = await response.json();

        if (!data.success) {
          message.textContent = data.message;
          return;
        }

        sessionStorage.setItem("crew_username", username);

        window.location.href = "/CrewPanel/otp";
      });
    </script>
  </body>
</html>
